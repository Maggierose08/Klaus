steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-east4-docker.pkg.dev/klaus-508805/trading/web:$SHORT_SHA'
      - '-t'
      - 'us-east4-docker.pkg.dev/klaus-508805/trading/web:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-east4-docker.pkg.dev/klaus-508805/trading/web']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'trading-web'
      - '--image=us-east4-docker.pkg.dev/klaus-508805/trading/web:$SHORT_SHA'
      - '--region=us-east4'
images:
  - 'us-east4-docker.pkg.dev/klaus-508805/trading/web:$SHORT_SHA'
  - 'us-east4-docker.pkg.dev/klaus-508805/trading/web:latest'
